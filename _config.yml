title: BeSafeShare
email: your-email@example.com
description: >-
  Write an awesome description for your new site here.

domain: caresets.github.io
url: https://caresets.github.io
baseurl: /caresets-src

# Build settings
theme: just-the-docs
remote_theme: pmarsceill/just-the-docs
plugins:
  - jekyll-default-layout
  - jekyll-spaceship  

color_scheme: wider

search_enabled: false

logo: "/assets/images/besafeshare.png"

# Exclude from processing
#
# Anything not listed here is copied verbatim into _site and deployed. Content
# sources, working files and build scripts are NOT site content - keep them out.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - old_docs
  - node_modules/
  - README.md
  - SECURITY-HEADERS.md
  - DELIVERY-NOTE.md
  - vendor/bundle/
  - vendor/
  - vendor/cache/

  # Authored content. _resources/ is generated from this and is what the site
  # serves (see the `include:` below), so the sources themselves stay out.
  - input/

  # Generated deliverables and working files.
  - models/
  - glossary-changes/
  - archive/

  # Pages disabled by renaming. Jekyll still renders and publishes these
  # unless excluded - unlinked, but reachable by URL.
  - "*.mdNO"
  - "**/*.mdNO"

  # Generated working files. generate_glossary.py writes timestamped backups
  # beside the CodeSystems; they are internal history, not deliverable content.
  - "*.backup.json"
  - "_resources/glossary/*.backup.json"

  # Export libraries for formats that are switched off in `exports:` above.
  # Jekyll copies assets wholesale, so without this they ship unreferenced -
  # 2.1 MB of third-party code in the deliverable that no page loads.
  # Re-enable a format above AND delete its line here, together.
  - assets/js/vendor/pdfmake-0.2.7.min.js
  - assets/js/vendor/pdfmake-vfs_fonts-0.2.7.js
  - assets/js/vendor/jszip-3.10.1.min.js
  - assets/js/vendor/buttons.print-2.4.2.min.js

  # Build tooling.
  - lib/
  - __pycache__/
  - "*.py"
  - "*.bat"
  - VERSION
  - notes.txt
  - "Logical Model Template.xlsx"

# Hide the Status column on glossary tables (the Concept Status page always shows it).
# Set to true to show Status everywhere, or override per page with `show_status:` front matter.
glossary_show_status: false

# Table export formats.
#
# Excel needs JSZip (~98 KB) and PDF needs pdfMake + its font file (~2.15 MB).
# Both are third-party libraries that would otherwise load on every page,
# including pages with no table. Turning a format off removes its option from
# the download menu AND stops its library being served at all.
#
# csv and markdown need no extra library: csv comes from the DataTables Buttons
# HTML5 module already loaded, markdown is generated by our own code.
exports:
  csv: true
  markdown: true
  excel: false
  pdf: false
  print: false

# Content version
content_version: "0.1"

footer_content: "Content version 0.1 | Copyright &copy; 2025 RIZIV-INAMI"

aux_links_new_tab: true
heading_anchors: true

gh_edit_link: false
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/caresets/glossary"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

include: 
  - "_resources"

# Clean URLs based on file path
permalink: pretty

# # Collections for each language
# collections:
#   en:
#     output: true
#     permalink: /en/:path/
#   fr:
#     output: true
#     permalink: /fr/:path/
#   nl:
#     output: true
#     permalink: /nl/:path/

# Auto-set lang for each collection
defaults:
  # Disable the just-the-docs auto child-page "Table of contents" on all pages
  - scope:
      path: ""
    values:
      has_toc: false

  - scope:
      path: "en"
    values:
      lang: en

  - scope:
      path: "fr"
    values:
      lang: fr

  - scope:
      path: "nl"
    values:
      lang: nl

  # Exclude model-docs from navigation (they are loaded dynamically)
  - scope:
      path: "_resources/model-docs"
    values:
      nav_exclude: true
      search_exclude: true

# Language configuration
languages:
  - code: en
    name: English
    flag: 🇬🇧
  - code: fr
    name: Français
    flag: 🇫🇷
  - code: nl
    name: Nederlands
    flag: 🇳🇱
