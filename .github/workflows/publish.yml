name: Build, Publish & Package

# Runs the generation scripts, builds the site, publishes to the gh-pages
# branch, and produces a downloadable .zip for the RIZIV-INAMI website.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "archive/**"   # the auto-backup commit must not re-trigger this workflow
  workflow_dispatch:
    inputs:
      gh_pages_baseurl:
        description: "Baseurl for the gh-pages build (must match the repo name for a project page)"
        required: false
        default: ""
      riziv_baseurl:
        description: "Baseurl for the RIZIV-INAMI zip (empty = domain root, or e.g. /besafeshare)"
        required: false
        default: ""

permissions:
  contents: write        # needed to push to the gh-pages branch

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Resolution order: manual "Run workflow" input -> repo variable -> literal default.
      # Configure persistently in Settings > Secrets and variables > Actions > Variables.
      # The public repository GitHub Pages serves. This repository is private,
      # so the built site is pushed there rather than to a branch of this one.
      # Set it as a repository variable: Settings > Secrets and variables >
      # Actions > Variables > PAGES_REPO, e.g. caresets/caresets.github.io.
      PAGES_REPO: ${{ vars.PAGES_REPO || 'caresets/caresets' }}

      # Left blank, the baseurl is derived from PAGES_REPO in the step below.
      # It must match the repo that SERVES the site, not this one - a project
      # page is served under /<repo>, and a <name>.github.io repo under /. The
      # old default was this repository's own name, which would 404 every asset
      # once the two repositories differ.
      GH_PAGES_BASEURL: ${{ github.event.inputs.gh_pages_baseurl || vars.GH_PAGES_BASEURL || '' }}
      RIZIV_BASEURL: ${{ github.event.inputs.riziv_baseurl || vars.RIZIV_BASEURL || '' }}
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1. Did this change touch the content source (input/ or VERSION)? ----
      # If yes  -> regenerate _resources/, snapshot a backup, commit both (Python).
      # If no   -> skip Python entirely and just build & deploy what's committed.
      - name: Detect content changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            content:
              - 'input/**'
              - 'VERSION'

      - name: Set up Python
        if: steps.filter.outputs.content == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      # The content scripts read the workbooks with openpyxl, which is not in
      # the standard library and not preinstalled on the runner.
      - name: Install Python dependencies
        if: steps.filter.outputs.content == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Regenerate content + snapshot backup (content changed only)
        if: (steps.filter.outputs.content == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          python build_content.py      # input/ -> _resources/ (models, glossary, mappings)
          python backup_content.py     # snapshot input/ -> archive/v<VERSION>/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _resources archive
          if git diff --cached --quiet; then
            echo "Content already up to date; nothing to commit."
          else
            git commit -m "chore: regenerate content + snapshot input v$(cat VERSION) [skip ci]"
            git push
          fi

      # ---- 2. Build the site (always — from the committed/regenerated _resources) ----
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Fail here rather than publishing to the wrong place, or building with
      # a baseurl that silently breaks every stylesheet and script.
      - name: Resolve the Pages target
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$PAGES_REPO" ]; then
            echo "::error::PAGES_REPO is not set. Add it under Settings > Secrets"\
                 " and variables > Actions > Variables, as owner/repo of the public"\
                 " repository GitHub Pages serves."
            exit 1
          fi
          if [ -z "$GH_PAGES_BASEURL" ]; then
            name="${PAGES_REPO#*/}"
            case "$name" in
              *.github.io) derived="" ;;
              *)           derived="/$name" ;;
            esac
            echo "GH_PAGES_BASEURL=$derived" >> "$GITHUB_ENV"
            echo "Derived baseurl '$derived' from $PAGES_REPO"
          else
            echo "Using the configured baseurl '$GH_PAGES_BASEURL'"
          fi

      - name: Build site for GitHub Pages
        run: bundle exec jekyll build --baseurl "$GH_PAGES_BASEURL" --destination _site_ghpages

      # _config_riziv.yml clears `url`, which otherwise stays pointed at the
      # public GitHub Pages copy and makes every RIZIV page declare that copy
      # as its canonical version.
      - name: Build site for RIZIV-INAMI
        run: bundle exec jekyll build --config _config.yml,_config_riziv.yml --baseurl "$RIZIV_BASEURL" --destination _site_riziv

      # ---- 3. Package the RIZIV-INAMI deployable as a .zip ----
      - name: Create RIZIV-INAMI zip
        run: (cd _site_riziv && zip -r -q ../riziv-inami-site.zip .)

      # Include the zip in the published site so it gets a stable, public URL
      # (e.g. https://caresets.github.io/glossary/riziv-inami-site.zip)
      - name: Add zip to the gh-pages payload
        run: cp riziv-inami-site.zip _site_ghpages/

      # ---- 4. Publish to the public Pages repository (only from main) ----
      #
      # GITHUB_TOKEN can only write to this repository, so pushing to another
      # one needs a token of its own: a fine-grained PAT with Contents: write
      # on the target, stored here as the secret PAGES_DEPLOY_TOKEN. A deploy
      # key works too - see the action's `deploy_key` input.
      - name: Deploy to the public Pages repository
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ env.PAGES_REPO }}
          publish_dir: ./_site_ghpages
          # The branch GitHub Pages is configured to serve in the target
          # repository - main there, not gh-pages. Publishing to the wrong
          # branch succeeds and changes nothing anyone can see.
          publish_branch: ${{ vars.PAGES_BRANCH || 'main' }}
          # Deliberately NOT force_orphan. That replaces the branch's entire
          # history with a single commit, which is fine for a gh-pages branch
          # holding only generated output and destructive on a main branch that
          # may carry a README, a licence, or history worth keeping.
          #
          # The action's default already removes files that are no longer in
          # publish_dir, so the target does not accumulate stale output; it just
          # does it as an ordinary commit on top of what is there.
          commit_message: "Publish site from caresets-src"

      # Also keep it as a workflow artifact (useful on non-main / manual runs)
      - name: Upload RIZIV-INAMI zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: riziv-inami-site
          path: riziv-inami-site.zip
          retention-days: 90
