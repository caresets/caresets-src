  tab_tree: "Tree"
  tab_uml: "UML"
  tab_concept: "Concept"
  concept_show_valuesets: "Show ValueSets"
  concept_legend: "The model is the amber box at the centre; each of its elements is a box around it, blue for data, grey for a reference to another model, amber for a group whose own elements sit further out and point at it. The dashed arrow from an element to its concept carries the cardinality: red when the element is required, green when optional. A green box is the ValueSet an element is bound to. Hover a box for the element's description."
  uml_show_references: "Show references to other models"
  uml_show_parent: "Show parent model"
  uml_show_bindings: "Show ValueSet bindings"
  uml_direction: "Layout:"
  uml_left_to_right: "left to right"
  uml_top_to_bottom: "top to bottom"
  uml_download_svg: "Download SVG"
  uml_copy_source: "Copy diagram source"
  uml_source: "Diagram source (nomnoml)"
  uml_legend: "Each box is a concept: the model, and each group inside it. Attributes are the data elements with their type and cardinality. A filled diamond is composition, labelled with how many of the part one whole may hold; a plain arrow is a reference to another model; a hollow arrowhead points to the parent model."
  legend_title: "How to read this table"
  legend_intro: "This is the structure as currently defined and published, with a few adaptations for readability."
  legend_close: "Close"
  legend:
    - term: "Tree"
      text: "The first row is the model itself. Rows indented below another row are the parts of that group; the triangle folds a group away or opens it. Expand All / Collapse All act on every group."
    - term: "Element"
      text: "The name of the data element. Hover it to read the full definition; the Description column shows the short text."
    - term: "Card."
      text: "Cardinality, min..max: how many times the element may occur. 0..1 optional, 1..1 required, 0..* any number, 1..* at least one."
    - term: "Type"
      text: "The data type. BackboneElement is a group with its own rows below it; Reference(X) points to another model."
    - term: "Glossary"
      text: "The agreed glossary term the element is mapped to, when one exists; it links to the glossary."
    - term: "Binding"
      text: "For coded elements: the strength (required, extensible, preferred, example) and the ValueSet the codes come from, linked to its page in the FHIR release the model is expressed for."
  # Short explanation shown when hovering a data type in the Type column.
  types:
    CodeableConcept: "A coded value: one or more codes from a terminology (SNOMED CT, LOINC, a Belgian ValueSet) plus optional free text."
    Coding: "A single code from one code system, with its display text."
    code: "A code taken from a fixed, required list of values."
    Reference: "A link to another record or model, such as the patient or the practitioner; Reference(X) says which."
    Identifier: "An identifier assigned by a system: a number and the system that issued it, such as a NISS or a hospital record number."
    BackboneElement: "A group: it has no value of its own, only the elements listed under it."
    string: "Free text, one line."
    markdown: "Free text that may contain formatting."
    boolean: "True or false."
    integer: "A whole number."
    positiveInt: "A whole number greater than zero."
    decimal: "A number that may have decimals."
    date: "A calendar date, possibly partial (year, year-month, full date)."
    dateTime: "A date with an optional time and time zone."
    time: "A time of day."
    instant: "An exact moment in time, to the second or finer."
    Period: "A time span with a start and/or an end."
    Quantity: "A measured amount: a number with a unit."
    Range: "A low and a high quantity."
    Ratio: "One quantity relative to another, such as 5 mg per 10 ml."
    Age: "A duration measured from birth, with a unit."
    Duration: "A length of time, with a unit."
    Annotation: "A note: text with who wrote it and when."
    Attachment: "A file or document, embedded or by link, with its content type."
    Binary: "Raw content such as an image or a PDF."
    ContactPoint: "A way to reach someone: phone, e-mail, and so on."
    Address: "A postal address."
    HumanName: "A person's name, split into family and given names."
    uri: "A web identifier or address."
    url: "A web address that can be opened."
    canonical: "A reference to a FHIR definition by its canonical URL."
    Dosage: "How a medication is to be taken: dose, frequency, route, timing."
    Extension: "An additional element defined outside the base model."
    Base: "The root of a model defined from scratch, with no inherited elements."
    Element: "The base FHIR element; the model is defined on top of it."
