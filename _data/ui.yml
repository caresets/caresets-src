  tab_tree: "Boomstructuur"
  tab_uml: "UML"
  tab_concept: "Concept"
  concept_show_valuesets: "ValueSets tonen"
  concept_legend: "Het model is de oranje doos in het midden; elk van zijn elementen is een doos eromheen, blauw voor een gegeven, grijs voor een verwijzing naar een ander model, oranje voor een groep waarvan de eigen elementen verder naar buiten staan en ernaar wijzen. De stippellijn van een element naar zijn concept draagt de kardinaliteit: rood als het element verplicht is, groen als het optioneel is. Een groene doos is de ValueSet waaraan een element gebonden is. Beweeg over een doos voor de beschrijving van het element."
  uml_show_references: "Verwijzingen naar andere modellen tonen"
  uml_show_parent: "Bovenliggend model tonen"
  uml_show_bindings: "ValueSet-bindings tonen"
  uml_direction: "Indeling:"
  uml_left_to_right: "van links naar rechts"
  uml_top_to_bottom: "van boven naar beneden"
  uml_download_svg: "SVG downloaden"
  uml_copy_source: "Diagrambron kopiëren"
  uml_source: "Diagrambron (nomnoml)"
  uml_legend: "Elke doos is een concept: het model, en elke groep erin. Attributen zijn de gegevenselementen met hun type en kardinaliteit. Een gevulde ruit is compositie, met het aantal delen dat één geheel mag bevatten; een gewone pijl is een verwijzing naar een ander model; een holle pijlpunt wijst naar het bovenliggende model."
  legend_title: "Hoe deze tabel te lezen"
  legend_intro: "Dit is de structuur zoals ze momenteel is gedefinieerd en gepubliceerd, met enkele aanpassingen voor de leesbaarheid."
  legend_close: "Sluiten"
  legend:
    - term: "Boomstructuur"
      text: "De eerste rij is het model zelf. Rijen die onder een andere rij inspringen zijn de onderdelen van die groep; het driehoekje klapt een groep in of uit. Alles uitklappen / Alles inklappen werken op elke groep."
    - term: "Element"
      text: "De naam van het gegevenselement. Beweeg erover om de volledige definitie te lezen; de kolom Beschrijving toont de korte tekst."
    - term: "Card."
      text: "Kardinaliteit, min..max: hoe vaak het element mag voorkomen. 0..1 optioneel, 1..1 verplicht, 0..* willekeurig aantal, 1..* minstens één."
    - term: "Type"
      text: "Het gegevenstype. BackboneElement is een groep met eigen rijen eronder; Reference(X) verwijst naar een ander model."
    - term: "Glossarium"
      text: "De afgesproken glossariumterm waaraan het element gekoppeld is, als die bestaat; de link gaat naar het glossarium."
    - term: "Binding"
      text: "Voor gecodeerde elementen: de sterkte (required, extensible, preferred, example) en de ValueSet waar de codes vandaan komen, met een link naar de pagina in de FHIR-release waarvoor het model is uitgedrukt."
  # Short explanation shown when hovering a data type in the Type column.
  types:
    CodeableConcept: "Een gecodeerde waarde: een of meer codes uit een terminologie (SNOMED CT, LOINC, een Belgische ValueSet) plus optionele vrije tekst."
    Coding: "Eén code uit één codesysteem, met zijn weergavetekst."
    code: "Een code uit een vaste, verplichte lijst van waarden."
    Reference: "Een verwijzing naar een ander record of model, zoals de patiënt of de zorgverlener; Reference(X) zegt welk."
    Identifier: "Een identificator toegekend door een systeem: een nummer en het systeem dat het uitgaf, zoals een INSZ of een ziekenhuisdossiernummer."
    BackboneElement: "Een groep: heeft geen eigen waarde, alleen de elementen die eronder staan."
    string: "Vrije tekst, één regel."
    markdown: "Vrije tekst die opmaak kan bevatten."
    boolean: "Waar of onwaar."
    integer: "Een geheel getal."
    positiveInt: "Een geheel getal groter dan nul."
    decimal: "Een getal dat decimalen kan hebben."
    date: "Een kalenderdatum, eventueel gedeeltelijk (jaar, jaar-maand, volledige datum)."
    dateTime: "Een datum met optionele tijd en tijdzone."
    time: "Een tijdstip van de dag."
    instant: "Een exact moment, tot op de seconde of fijner."
    Period: "Een tijdspanne met een begin en/of een einde."
    Quantity: "Een gemeten hoeveelheid: een getal met een eenheid."
    Range: "Een lage en een hoge hoeveelheid."
    Ratio: "Een hoeveelheid ten opzichte van een andere, zoals 5 mg per 10 ml."
    Age: "Een duur gemeten vanaf de geboorte, met een eenheid."
    Duration: "Een tijdsduur, met een eenheid."
    Annotation: "Een notitie: tekst met wie ze schreef en wanneer."
    Attachment: "Een bestand of document, ingesloten of via een link, met zijn inhoudstype."
    Binary: "Ruwe inhoud zoals een afbeelding of een PDF."
    ContactPoint: "Een manier om iemand te bereiken: telefoon, e-mail, enzovoort."
    Address: "Een postadres."
    HumanName: "De naam van een persoon, gesplitst in familienaam en voornamen."
    uri: "Een webidentificator of -adres."
    url: "Een webadres dat geopend kan worden."
    canonical: "Een verwijzing naar een FHIR-definitie via haar canonieke URL."
    Dosage: "Hoe een geneesmiddel moet worden ingenomen: dosis, frequentie, toedieningsweg, tijdstippen."
    Extension: "Een extra element dat buiten het basismodel is gedefinieerd."
    Base: "De wortel van een model dat van nul is gedefinieerd, zonder geërfde elementen."
    Element: "Het FHIR-basiselement; het model is erbovenop gedefinieerd."
