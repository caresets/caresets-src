# Interface strings for the model pages (logical-model and model-viewer layouts),
# per language. A layout picks the block matching page.lang and falls back to en.
en:
  element_structure: "Element Structure"
  metadata: "Metadata"
  element: "Element"
  card: "Card."
  type: "Type"
  description: "Description"
  glossary: "Glossary"
  binding: "Binding"
  expand_all: "Expand All"
  collapse_all: "Collapse All"
  download_this_model: "Download this model"
  download: "Download"
  format: "Format:"
  loading: "Loading model..."
  legend_title: "How to read this table"
  legend_close: "Close"
  legend:
    - term: "Tree"
      text: "The first row is the model itself. Rows indented below another row are the parts of that group; the triangle folds a group away or opens it. Expand All / Collapse All act on every group."
    - term: "Element"
      text: "The name of the data element. Hover it to read the full definition; the Description column shows the short text."
    - term: "Card."
      text: "Cardinality, min..max: how many times the element may occur. 0..1 optional, 1..1 required, 0..* any number, 1..* at least one."
    - term: "Type"
      text: "The data type. BackboneElement is a group with its own rows below it; Reference(X) points to another model; the [x] choice marker is not shown."
    - term: "Glossary"
      text: "The agreed glossary term the element is mapped to, when one exists; it links to the glossary."
    - term: "Binding"
      text: "For coded elements: the strength (required, extensible, preferred, example) and the ValueSet the codes come from, linked to its page in the FHIR release the model is expressed for."
fr:
  element_structure: "Structure des éléments"
  metadata: "Métadonnées"
  element: "Élément"
  card: "Card."
  type: "Type"
  description: "Description"
  glossary: "Glossaire"
  binding: "Binding"
  expand_all: "Tout déplier"
  collapse_all: "Tout replier"
  download_this_model: "Télécharger ce modèle"
  download: "Télécharger"
  format: "Format :"
  loading: "Chargement du modèle..."
  legend_title: "Comment lire ce tableau"
  legend_close: "Fermer"
  legend:
    - term: "Arborescence"
      text: "La première ligne est le modèle lui-même. Les lignes en retrait sous une autre ligne sont les composants de ce groupe ; le triangle replie ou déplie un groupe. Tout déplier / Tout replier agissent sur tous les groupes."
    - term: "Élément"
      text: "Le nom de l'élément de données. Survolez-le pour lire la définition complète ; la colonne Description montre le texte court."
    - term: "Card."
      text: "Cardinalité, min..max : combien de fois l'élément peut apparaître. 0..1 facultatif, 1..1 obligatoire, 0..* un nombre quelconque, 1..* au moins un."
    - term: "Type"
      text: "Le type de données. BackboneElement est un groupe avec ses propres lignes en dessous ; Reference(X) renvoie à un autre modèle ; le marqueur de choix [x] n'est pas affiché."
    - term: "Glossaire"
      text: "Le terme du glossaire auquel l'élément est mappé, lorsqu'il existe ; il renvoie au glossaire."
    - term: "Binding"
      text: "Pour les éléments codés : la force (required, extensible, preferred, example) et le ValueSet d'où viennent les codes, avec un lien vers sa page dans la version FHIR pour laquelle le modèle est exprimé."
nl:
  element_structure: "Elementstructuur"
  metadata: "Metadata"
  element: "Element"
  card: "Card."
  type: "Type"
  description: "Beschrijving"
  glossary: "Glossarium"
  binding: "Binding"
  expand_all: "Alles uitklappen"
  collapse_all: "Alles inklappen"
  download_this_model: "Dit model downloaden"
  download: "Downloaden"
  format: "Formaat:"
  loading: "Model laden..."
  legend_title: "Hoe deze tabel te lezen"
  legend_close: "Sluiten"
  legend:
    - term: "Boomstructuur"
      text: "De eerste rij is het model zelf. Rijen die onder een andere rij inspringen zijn de onderdelen van die groep; het driehoekje klapt een groep in of uit. Alles uitklappen / Alles inklappen werken op elke groep."
    - term: "Element"
      text: "De naam van het gegevenselement. Beweeg erover om de volledige definitie te lezen; de kolom Beschrijving toont de korte tekst."
    - term: "Card."
      text: "Kardinaliteit, min..max: hoe vaak het element mag voorkomen. 0..1 optioneel, 1..1 verplicht, 0..* willekeurig aantal, 1..* minstens één."
    - term: "Type"
      text: "Het gegevenstype. BackboneElement is een groep met eigen rijen eronder; Reference(X) verwijst naar een ander model; de keuzemarkering [x] wordt niet getoond."
    - term: "Glossarium"
      text: "De afgesproken glossariumterm waaraan het element gekoppeld is, als die bestaat; de link gaat naar het glossarium."
    - term: "Binding"
      text: "Voor gecodeerde elementen: de sterkte (required, extensible, preferred, example) en de ValueSet waar de codes vandaan komen, met een link naar de pagina in de FHIR-release waarvoor het model is uitgedrukt."
